<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT 2nd Year · NextGen Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#f6f1e7;--dim:rgba(246,241,231,.66);--glass:rgba(8,10,28,.46);--line:rgba(246,241,231,.16);--amber:#ffc857;--bad:#ff8a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#0b1026}
body{margin:0;min-height:100vh;font:400 1rem/1.5 Figtree,system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden}
.sky::after{content:"";position:absolute;inset:0;opacity:var(--stars,0);background:
radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 27% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 24%,#fff,transparent),radial-gradient(1px 1px at 63% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 30%,#fff,transparent),radial-gradient(1px 1px at 90% 9%,#fff,transparent),radial-gradient(1px 1px at 8% 46%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 40%,#fff,transparent),radial-gradient(1px 1px at 35% 52%,#fff,transparent)}
.orb{position:absolute;width:150px;height:150px;border-radius:50%;transform:translate(-50%,0);transition:left 1s,top 1s}
.orb.sun{background:radial-gradient(circle,#fff3c4 0 28%,#ffc857 48%,rgba(255,200,87,.35) 62%,transparent 72%)}
.orb.moon{width:96px;height:96px;background:#e9ecf5;box-shadow:inset -18px -6px 0 0 #aab2cc,0 0 70px 14px rgba(180,195,255,.3)}
.top{display:flex;justify-content:space-between;align-items:center;padding:1rem clamp(1rem,5vw,2.5rem)}
.who{font-weight:600}.who small{display:block;font-weight:400;color:var(--dim)}
.ghost{background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:.45rem 1rem;backdrop-filter:blur(12px)}
main{max-width:860px;margin:0 auto;padding:0 clamp(1rem,5vw,2rem) 8rem}
.big{font:800 clamp(2.3rem,8vw,5.2rem)/.98 "Bricolage Grotesque",sans-serif;letter-spacing:-.035em;margin:.3rem 0 .8rem;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.hero{padding:min(22vh,9rem) 0 2rem;text-shadow:0 1px 12px rgba(0,0,0,.4)}
.hero .when{color:var(--dim);font-weight:500}
.hero .sub{font-size:1.1rem;color:var(--ink)}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:1.2rem;overflow:hidden;max-width:420px}
.bar i{display:block;height:100%;background:var(--amber);border-radius:9px}
.strip{display:flex;gap:.5rem;overflow-x:auto;padding:.3rem 0 1rem;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:.5rem 1rem;backdrop-filter:blur(12px);color:var(--dim)}
.chip[aria-pressed=true]{background:var(--ink);color:#12142b;font-weight:600;border-color:var(--ink)}
.chip.today::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:.45rem;vertical-align:middle}
h2.dayh{font:500 1.1rem "Bricolage Grotesque",sans-serif;margin:1.6rem 0 .6rem;color:var(--dim)}
.row{display:grid;grid-template-columns:7.5rem 1fr;gap:1rem;margin-bottom:.75rem;align-items:stretch}
.row time{color:var(--dim);font-size:.9rem;padding-top:1rem;text-align:right}
.card{background:var(--glass);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:.9rem 1.1rem;backdrop-filter:blur(14px)}
.card b{font-weight:600;display:block}
.card span{color:var(--dim);font-size:.9rem}
.card em{font-style:normal;float:right;margin-left:.8rem;font-weight:600;color:var(--c)}
.row.done{opacity:.45}
.row.live .card{box-shadow:0 0 0 1px var(--c),0 0 36px -4px var(--c);background:rgba(8,10,28,.68)}
.empty{color:var(--dim);padding:2rem 0}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:1.2rem;backdrop-filter:blur(14px)}
.chat{display:flex;flex-direction:column;gap:.7rem;padding:7rem 0 1rem}
.msg{max-width:86%;padding:.7rem 1rem;border-radius:16px;white-space:pre-wrap;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px)}
